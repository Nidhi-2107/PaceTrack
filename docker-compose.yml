services:
  postgres:
    image: postgres:16-alpine
    container_name: pacetrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pacetrack}
      POSTGRES_USER: ${POSTGRES_USER:-pacetrack_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pacetrack_secret_change_in_prod}
    ports:
      # Defaults to 5433 on the host to avoid collisions with any existing local PostgreSQL
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pacetrack_user} -d ${POSTGRES_DB:-pacetrack}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pacetrack-net

volumes:
  postgres_data:
    name: pacetrack_postgres_data

networks:
  pacetrack-net:
    name: pacetrack-network
